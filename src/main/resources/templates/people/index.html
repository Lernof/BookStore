<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>People</title>
    <style>
        body {
            background-image: url('/images/bookShelf.jpeg');
            background-size: cover;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .form-group {
            display: flex;
        }

        .form-group select {
            flex: 1;
            margin-right: 10px;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            color: #333;
            text-align: center; /* Center align text */
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            margin-top: 20px;
        }

        label {
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        .button-container {
            text-align: center;
            margin-top: 20px;
        }
        .button-container button {
            background-color: #be9462;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .custom-button {
            background-color: #be9462;
            border: none; /* Add this line to remove the border */
        }
        .custom-delete-button {
            background-color: #ff003a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-button {
            background-color: #be9462;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-button:hover {
            background-color: #9d6523;
        }

        /* Style for the person's image */
        .person-image {
            max-width: 200px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            margin: 20px auto;
            display: block;
        }

        /* Style for person info */
        .person-info p {
            font-size: 18px; /* Increase font size */
            margin-bottom: 10px; /* Add space between lines */
        }

        /* Style for book buttons */
        .book-button {
            background-color: #ffa473;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .book-button:hover {
            background-color: #9d6523;
        }
        .book-image {
            max-width: 100px; /* Adjust as needed */
            max-height: 150px; /* Adjust as needed */
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Display the person's image -->
    <img th:src="@{/people/{id}/image(id=${person.getId()})}" class="person-image" alt="Person Image">

    <div class="person-info">
        <p><strong>Full Name:</strong> <span th:text="${person.getFullName()}"></span></p>
        <p><strong>Date of Birth:</strong> <span th:text="${person.getYear_of_birth()}"></span></p>
    </div>

    <hr/>
    <div th:if="${books != null}">
        <div th:each="book: ${books}" th:attr="class=${book.isOutdated() == true ? 'outdated' : 'non-outdated'}">
            <img th:src="@{/books/{id}/image(id=${book.getId()})}" class="book-image" alt="Book Image">
            <p th:text="${book.getName()}"></p>
            <a th:href="@{/books/{id}(id=${book.getId()})}">
                <button class="book-button">View Book</button>
            </a>
        </div>
    </div>


    <div th:if="${#lists.size(books) == 0}">
        <p>This person doesn't own any book</p>
    </div>
    <hr/>
    <a th:if="${role=='ROLE_ADMIN' || threadId == personId}" th:href="@{{id}/edit(id=${person.getId()})}">
        <button class="edit-button">Edit</button>
    </a>

    <a th:href="@{/people}">
        <button class="edit-button" th:href="@{/people}">Back To List</button>
    </a>
    <hr/>
    <form class="button-container" th:method="DELETE" th:action="@{{id}(id=${person.getId()})}">
        <input type="submit" value="Delete" class="custom-delete-button">
    </form>
    <a th:href="@{/edit}"></a>
</div>
</body>
</html>
